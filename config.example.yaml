# frAInk - device config. Copy to config.yaml and fill in your own values:
#   cp config.example.yaml config.yaml
# config.yaml is gitignored. Anything you leave out falls back to the code defaults.

# Voice Companion / Note Taker / HA Controller talk to a xiaozhi-esp32-server.
server:
  websocket_url_lan: "ws://AI_SERVER_LAN_IP:8000/api/ws"          # used on your home network
  websocket_url_tailscale: "ws://AI_SERVER_TAILNET_IP:8000/api/ws" # used everywhere else
  device_id: "fraink-01"
  client_id: ""          # generated on first run if empty
  protocol_version: 1

network:
  home_subnet: "192.168.1.0/24"   # LAN that counts as "home"
  ap_ssid: "PiSugar-Setup"        # Wi-Fi setup access point name
  ap_timeout: 15

audio:
  sample_rate_in: 16000
  sample_rate_out: 24000
  opus_frame_duration: 60
  alsa_device: "hw:0,0"           # WM8960 on the WhisPlay

wakeword:
  enabled: true
  model: "hey_frank_v5"   # also bundled: hey_stackchan_v1, hey_m5_v3 (switch in Settings -> Phrase)
  cutoff: null            # null = use the model JSON's value; raise to ~0.85 if it false-triggers

voice:
  listen_mode: "auto"     # auto = continuous conversation, manual = one-shot

display:
  screensaver_dim_seconds: 15
  screensaver_off_seconds: 60

# Voice memos are pushed to your phone through a self-hosted ntfy server.
# Use a write-only token scoped to the topic. Blank token -> push skipped.
ntfy:
  enabled: true
  url: "https://ntfy.your-tailnet.ts.net"
  topic: "memos"
  token: ""

# Meeting summaries are emailed (HTML body + PDF + .md).
# Gmail: smtp.gmail.com:465 with an App Password. Blank password -> email skipped.
email:
  enabled: true
  smtp_host: "smtp.gmail.com"
  smtp_port: 465          # 465 = implicit TLS, 587 = STARTTLS
  username: ""
  password: ""
  from: ""                # defaults to username
  to: ""                  # comma-separated; defaults to username

# Optional: drop voice memos and meeting notes into a basic-memory vault inbox over scp.
second_brain:
  enabled: false
  host: "memory-server.your-tailnet.ts.net"
  user: "memos"
  inbox_path: "/path/to/vault/_inbox"
  ssh_key: "~/.ssh/id_ed25519"
  scope: "voice_memos"

ha_controller:
  entities:
    - sensor.living_room_temperature
    - light.living_room
    - lock.front_door

pomodoro:
  work_minutes: 25
  short_break_minutes: 5
  long_break_minutes: 15
  sessions_before_long_break: 4
  ha_scene_focus: ""
  ha_scene_break: ""

# Translator + Meeting skip xiaozhi and call the AI services directly over HTTP.
# Use tailnet addresses so they work at home and over a phone hotspot.
ai_services:
  stt_backend: "whispercpp"                                # whispercpp (GPU) with speaches fallback, or speaches
  whispercpp_url: "http://AI_SERVER_TAILNET_IP:8890"       # whisper.cpp server (/inference)
  speaches_url: "http://AI_SERVER_TAILNET_IP:8001"         # faster-whisper STT + Piper TTS
  ollama_fast_url: "http://AI_SERVER_TAILNET_IP:11434"     # small model for translation
  deep_url: "http://LLM_SERVER_TAILNET_IP:8000/v1"         # big model for meeting summaries (vLLM / OpenAI API)
  deep_api: "openai"                                       # openai | ollama
  stt_model: "Systran/faster-whisper-small"
  fast_model: "gemma4:e2b-it-qat"
  fast_num_ctx: 8192                                       # must match the server's ctx or Ollama reloads the model
  deep_model: "qwen3.8-27b"
  diarize_url: "http://AI_SERVER_TAILNET_IP:8895"          # server/diarize_server.py (speaker labels + PDF)

translator: {}   # defaults: es/fr/de/it/pt <-> en

meeting:
  language: "en"     # pin STT language for meeting chunks
  scope: "meetings"  # second-brain scope
  diarize: true      # label speakers (Speaker 1, Speaker 2...)
  speakers: 0        # 0 = auto-detect
  keep_audio: false  # keep the meeting .wav after the report is built
  notify: true       # ntfy ping when the summary email goes out
